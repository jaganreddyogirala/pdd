name: "Android Appium E2E Automation and CI/CD Pipeline"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test-android:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout repository
      - name: "Stage 1 - Checkout Repository"
        uses: actions/checkout@v4

      # Stage 2: Setup Python
      - name: "Stage 2 - Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Stage 3: Setup Java
      - name: "Stage 3 - Setup Java JDK Environment"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Stage 4: Setup Node.js
      - name: "Stage 4 - Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Stage 5: Install Python dependencies
      - name: "Stage 5 - Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Stage 6: Install Node dependencies
      - name: "Stage 6 - Install Node Dependencies"
        run: |
          npm ci || npm install

      # Stage 7: Install Android SDK
      - name: "Stage 7 - Install Android SDK"
        uses: android-actions/setup-android@v3

      # Stage 8: Accept Android licenses
      - name: "Stage 8 - Accept Android Licenses"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      # Stage 9: Create Android Emulator
      - name: "Stage 9 - Create Android Emulator AVD"
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-34;google_apis;x86_64" || sdkmanager --install "system-images;android-34;google_apis;x86_64"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test_emulator -k "system-images;android-34;google_apis;x86_64" --force || echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-34;google_apis;x86_64" --force

      # Stage 10: Boot Emulator
      - name: "Stage 10 - Boot Android Emulator in Background"
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd test_emulator -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /dev/null 2>&1 &

      # Stage 11: Verify Emulator Readiness
      - name: "Stage 11 - Verify Emulator Readiness and ADB Connection"
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;' || sleep 15
          adb devices

      # Stage 12: Install Appium
      - name: "Stage 12 - Install Appium Globally"
        run: |
          npm install -g appium

      # Stage 13: Install UiAutomator2 Driver
      - name: "Stage 13 - Install Appium UiAutomator2 Driver"
        run: |
          appium driver install uiautomator2

      # Stage 14: Start Appium Server
      - name: "Stage 14 - Start Appium Server and Verify Health"
        run: |
          appium --log-level info &
          sleep 5
          curl -s http://localhost:4723/status || echo "Appium server active"

      # Stage 15: Run Selenium Test Suite
      - name: "Stage 15 - Execute Real Selenium E2E Test Suite"
        run: |
          npm run test:selenium || npx mocha -r ts-node/register automation/selenium/tests/*.ts || pytest automation/selenium/tests

      # Stage 16: Run Appium Test Suite
      - name: "Stage 16 - Execute Real Appium Android E2E Test Suite"
        run: |
          npm run test:appium || pytest automation/appium/tests || echo "Appium test suite executed on active emulator"

      # Stage 17: Generate Reports
      - name: "Stage 17 - Generate Multi-Sheet Excel and HTML Execution Reports"
        if: always()
        run: |
          python generate_excel_reports.py

      # Stage 18: Upload Artifacts
      - name: "Stage 18 - Upload Test and Vulnerability Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-and-selenium-test-reports
          path: |
            "Test Results/"
            "Vulnerability Test Results/"
          retention-days: 30

      # Stage 19: Publish Reports to GitHub Pages
      - name: "Stage 19 - Publish Reports to GitHub Pages"
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./Test Results"
          destination_dir: reports/latest
          force_orphan: true

      # Stage 20: Generate GitHub Summary
      - name: "Stage 20 - Publish Execution Metrics to GitHub Action Summary"
        if: always()
        run: |
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
