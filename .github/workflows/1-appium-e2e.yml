name: "1 - Appium Android E2E Automation"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  appium-android-test:
    runs-on: ubuntu-latest

    steps:
      - name: "Stage 1 - Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 2 - Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Stage 3 - Setup Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "Stage 4 - Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Stage 5 - Install Python Dependencies"
        run: |
          pip install openpyxl pandas pytest requests Appium-Python-Client

      - name: "Stage 6 - Execute Appium Test Suite & Report Generation"
        run: |
          python generate_excel_reports.py

      - name: "Stage 7 - Upload Appium Reports & Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            Test Results
            Vulnerability Test Results
          retention-days: 30
