name: Security Review & DevSecOps Automated Assessment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan Depth'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - quick

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency & SAST Review
        run: |
          pip install openpyxl pandas
          python generate_excel_reports.py

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-artifacts
          path: Vulnerability Test Results/
          retention-days: 30
