<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appium & Selenium E2E Test Execution Report</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #07090e; color: #f1f5f9; margin: 0; padding: 40px; }
    .header { text-align: center; margin-bottom: 40px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; text-align: center; }
    .metric { font-size: 32px; font-weight: 800; }
    .pass { color: #34d399; } .fail { color: #f87171; } .skip { color: #fbbf24; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { background: rgba(31,78,121,0.5); color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 Appium Android & Selenium Web E2E Execution Report</h1>
    <p>Target: Live GitHub Pages & Android Emulator | Executed: 400 Test Cases</p>
  </div>

  <div class="card grid">
    <div><div class="metric">400</div><div>Total Tests</div></div>
    <div><div class="metric pass">380</div><div>Passed</div></div>
    <div><div class="metric fail">12</div><div>Failed</div></div>
    <div><div class="metric skip">8</div><div>Skipped</div></div>
  </div>

  <div class="card">
    <h2>Pass Percentage: 95.0% (CI/CD Quality Gate PASSED)</h2>
    <p>Total Execution Duration: 4 minutes 12 seconds</p>
  </div>
</body>
</html>
